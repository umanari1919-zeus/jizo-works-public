<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>サービス・料金 | JIZO WORKS</title>
<meta name="description" content="Excel・CSV整理、AI・自動化診断、定型業務の自動化。JIZO WORKSのサービスと料金目安。">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<header><div class="wrap head"><a class="brand" href="../">JIZO WORKS</a><nav><a href="../#solve">無料ツール</a><a href="../compare/">比較</a><a href="../deals/">Deals</a></nav></div></header>
<main>
<section class="hero compact"><div class="wrap"><p class="kicker">SERVICES</p><h1>小さく頼んで、<br>仕組みにする。</h1><p>最初から大きなシステムを売りません。必要な範囲から始めます。</p></div></section>
<section class="light"><div class="wrap"><h2>料金目安</h2><div id="pricingGrid" class="grid"></div><p class="example-note">※料金は目安です。作業量・難易度・納期により事前見積で確定します。</p></div></section>

<section class="section"><div class="wrap"><h2>簡易見積</h2>
<div class="panel">
<div class="question-grid">
<label>作業タイプ<select id="quoteType"><option value="5000">Excel / CSV 整理</option><option value="9800">AI・自動化診断</option><option value="15000">定型業務の自動化</option></select></label>
<label>作業量<select id="quoteSize"><option value="1">小</option><option value="1.5">中</option><option value="2.2">大</option></select></label>
<label>納期<select id="quoteUrgency"><option value="1">通常</option><option value="1.25">急ぎ</option></select></label>
<label>継続性<select id="quoteRepeat"><option value="1">単発</option><option value="0.9">継続想定</option></select></label>
</div>
<button id="runQuote" class="cta">概算する</button>
<div id="quoteResult" class="result-box hidden"></div>
</div></div></section>

<section class="contact"><div class="wrap"><h2>相談文を作る</h2><p>概算後、そのまま相談用の文章をコピーできます。</p><a class="cta" href="../contact/" data-track="services:contact">無料相談へ →</a></div></section>
</main>
<footer><div class="wrap footer-inner"><span>JIZO WORKS</span><a href="../">Home</a></div></footer>
<script src="../assets/surface.js"></script>
<script type="module">
const pricing=await fetch("../data/pricing.json",{cache:"no-store"}).then(r=>r.json());
const grid=document.querySelector("#pricingGrid");
pricing.forEach(x=>{const a=document.createElement("article");a.innerHTML=`<em>${x.type.toUpperCase()}</em><h3>${x.name}</h3><p class="price">${x.price}</p>`;grid.appendChild(a);});
document.querySelector("#runQuote").addEventListener("click",()=>{
  const base=Number(document.querySelector("#quoteType").value);
  const size=Number(document.querySelector("#quoteSize").value);
  const urgency=Number(document.querySelector("#quoteUrgency").value);
  const repeat=Number(document.querySelector("#quoteRepeat").value);
  const estimate=Math.round(base*size*urgency*repeat/100)*100;
  const out=document.querySelector("#quoteResult");
  out.classList.remove("hidden");
  out.innerHTML=`<strong>概算 ${estimate.toLocaleString("ja-JP")}円〜</strong><span>正式価格は内容確認後の事前見積で確定します。</span><small>この概算は自動計算であり、契約価格ではありません。</small>`;
  JIZO.capture("quote_estimate",{estimate});
});
</script>
</body></html>
