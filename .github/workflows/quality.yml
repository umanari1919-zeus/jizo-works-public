name: Public Quality Gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block internal/private leakage
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(grep -RniE \
            "mykeibadb|127\.0\.0\.1:8790|Founder Approval|revenue_ledger|crm\.csv|OPENAI_API_KEY|sk-[A-Za-z0-9_-]+" \
            index.html assets data docs \
            --exclude='*.md' \
            --exclude='ad_inventory.json' \
            || true)"

          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Potential private/internal data leak detected."
            exit 1
          fi

          echo "Private/internal leakage audit PASS"

      - name: Validate ad inventory
        shell: python
        run: |
          import json
          import pathlib
          import sys

          path = pathlib.Path("data/ad_inventory.json")
          rows = json.loads(path.read_text(encoding="utf-8"))

          bad = []
          for row in rows:
              if row.get("status") == "approved" and not row.get("url"):
                  bad.append(row.get("id", "<unknown>"))

          if bad:
              print("Approved ads missing URL:", bad)
              sys.exit(1)

          print("Approved ads:", sum(r.get("status") == "approved" for r in rows))
          print("Ad inventory audit PASS")
