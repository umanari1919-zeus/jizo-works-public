name: Public Quality Gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block internal/private leakage
        shell: bash
        run: |
          set -euo pipefail
          MATCHES="$(grep -RniE \
            "mykeibadb|127\.0\.0\.1:8790|Founder Approval|revenue_ledger|crm\.csv|OPENAI_API_KEY|sk-[A-Za-z0-9_-]+" \
            index.html assets data docs \
            --exclude='*.md' \
            --exclude='ad_inventory.json' \
            || true)"

          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Potential private/internal data leak detected."
            exit 1
          fi

          echo "Private/internal leakage audit PASS"

      - name: Validate ad inventory
        shell: python
        run: |
          import json
          import pathlib
          import sys

          path = pathlib.Path("data/ad_inventory.json")
          rows = json.loads(path.read_text(encoding="utf-8"))

          bad = []
          for row in rows:
              if row.get("status") == "approved" and not row.get("url"):
                  bad.append(row.get("id", "<unknown>"))

          if bad:
              print("Approved ads missing URL:", bad)
              sys.exit(1)

          print("Approved ads:", sum(r.get("status") == "approved" for r in rows))
          print("Ad inventory audit PASS")

      - name: Validate public config
        shell: python
        run: |
          import json, pathlib, sys
          config=json.loads(pathlib.Path("data/public_config.json").read_text(encoding="utf-8"))
          if config.get("contact_mode") not in {"copy_only","mailto","form_endpoint"}:
              print("Invalid contact_mode")
              sys.exit(1)
          print("Public config audit PASS")

      - name: Validate sales intake surfaces
        shell: python
        run: |
          import json, pathlib, sys
          required = [
              pathlib.Path("contact/index.html"),
              pathlib.Path("quality/index.html"),
              pathlib.Path("privacy/index.html"),
              pathlib.Path("templates/index.html"),
              pathlib.Path("templates/automation-work-inventory.csv"),
          ]
          missing=[str(p) for p in required if not p.exists()]
          if missing:
              print("Missing intake surfaces:", missing)
              sys.exit(1)
          cfg=json.loads(pathlib.Path("data/public_config.json").read_text(encoding="utf-8"))
          mode=cfg.get("contact_mode")
          dest=cfg.get("contact_destination","")
          if mode in {"mailto","form_endpoint"} and not dest:
              print("Contact destination required for", mode)
              sys.exit(1)
          print("Sales intake surface audit PASS")

      - name: Validate monetization surfaces
        shell: python
        run: |
          import csv, json, pathlib, sys
          required=[
              "data/monetization.json",
              "data/offers-import-template.csv",
              "sponsor/index.html",
              "disclosure/index.html",
              "articles/index.html",
              "assets/monetization.js"
          ]
          missing=[p for p in required if not pathlib.Path(p).exists()]
          if missing:
              print("Missing monetization surfaces:",missing)
              sys.exit(1)

          rows=json.loads(pathlib.Path("data/offers.json").read_text(encoding="utf-8"))
          bad=[]
          for x in rows:
              if x.get("status")=="approved":
                  if not x.get("url") or not x.get("disclosure"):
                      bad.append(x.get("id"))
          if bad:
              print("Invalid approved offers:",bad)
              sys.exit(1)

          print("Monetization audit PASS")
